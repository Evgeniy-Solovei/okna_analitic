<style>
  .page-loader {
    position: fixed;
    inset: 0;
    z-index: 9999;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 14px;
    background: rgba(243, 246, 251, 0.92);
    backdrop-filter: blur(2px);
  }
  body[data-theme="dark"] .page-loader { background: rgba(7, 17, 28, 0.92); }
  body.is-loading .page-loader,
  body.is-loading .page-loader[hidden] { display: flex !important; }
  .page-loader-card {
    min-width: min(320px, calc(100vw - 32px));
    padding: 22px 24px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--panel);
    box-shadow: 0 18px 40px rgba(23, 32, 51, 0.14);
    text-align: center;
  }
  .page-loader-spinner {
    width: 34px; height: 34px; margin: 0 auto 12px;
    border: 3px solid var(--line); border-top-color: var(--blue);
    border-radius: 50%; animation: page-loader-spin 0.75s linear infinite;
  }
  .page-loader-title { margin: 0; font-size: 16px; font-weight: 750; }
  .page-loader-text { margin: 6px 0 0; font-size: 13px; color: var(--muted); font-weight: 600; }
  @keyframes page-loader-spin { to { transform: rotate(360deg); } }
</style>

<div class="page-loader" id="pageLoader" hidden>
  <div class="page-loader-card">
    <div class="page-loader-spinner" aria-hidden="true"></div>
    <p class="page-loader-title" id="pageLoaderTitle">Загрузка</p>
    <p class="page-loader-text" id="pageLoaderText">Применяем фильтры…</p>
  </div>
</div>

<script>
  (function () {
    const loader = document.getElementById("pageLoader");
    if (!loader) return;
    const titleEl = document.getElementById("pageLoaderTitle");
    const textEl = document.getElementById("pageLoaderText");
    let slowTimer = null;
    let navigating = false;

    function showLoader(title, text) {
      titleEl.textContent = title || "Загрузка";
      textEl.textContent = text || "Применяем фильтры…";
      loader.hidden = false;
      document.body.classList.add("is-loading");
      if (slowTimer) clearTimeout(slowTimer);
      // НЕ снимаем оверлей по таймеру — иначе белый экран, пока документ ещё «ожидает».
      slowTimer = setTimeout(function () {
        textEl.textContent = "Сервер отвечает дольше обычного, не закрывайте вкладку…";
      }, 8000);
    }

    function hideLoader() {
      if (slowTimer) clearTimeout(slowTimer);
      navigating = false;
      document.body.classList.remove("is-loading");
      loader.hidden = true;
    }

    window.addEventListener("pageshow", hideLoader);

    document.addEventListener("click", function (event) {
      if (event.metaKey || event.ctrlKey || event.shiftKey || event.altKey || event.button === 1) return;
      const link = event.target.closest("a");
      if (!link || !link.href) return;
      const href = link.getAttribute("href") || "";
      if (!href || href.startsWith("#") || href.startsWith("javascript:")) return;
      if (link.target && link.target !== "_self") return;
      try {
        if (new URL(link.href, location.href).origin !== location.origin) return;
      } catch (e) { return; }
      if (navigating) {
        event.preventDefault();
        return;
      }
      navigating = true;
      const isForce = /(?:\?|&)force=1(?:&|$)/.test(link.href);
      showLoader(
        isForce ? "Обновление данных" : "Загрузка",
        isForce ? "Запускаем фоновое обновление…" : "Применяем фильтры…"
      );
    }, true);

    document.addEventListener("submit", function (event) {
      const form = event.target;
      if (!(form instanceof HTMLFormElement)) return;
      if (navigating) {
        event.preventDefault();
        return;
      }
      navigating = true;
      if (form.classList.contains("logout-form")) {
        showLoader("Выход", "Завершаем сессию…");
        return;
      }
      showLoader("Загрузка", "Применяем фильтры…");
    }, true);
  })();
</script>
